<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1700" viewBox="0 0 1200 1700" role="img" aria-labelledby="title desc">
  <title id="title">OKS MCP Server monochrome vertical architecture</title>
  <desc id="desc">A clean vertical flow from a coding agent through an SSH tunnel to the CERN OKS MCP server, query pipeline, and filtered results.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#111111"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111; letter-spacing: .4px; }
      .subtitle { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #444; }
      .section { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111; }
      .label { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111; }
      .body { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #333; }
      .mono { font: 500 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #222; }
      .box { fill: #fff; stroke: #111; stroke-width: 2; }
      .section-box { fill: #fafafa; stroke: #111; stroke-width: 2; stroke-dasharray: 8 7; }
      .line { stroke: #111; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #111; stroke-width: 2.2; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="1700" fill="#eeeeee"/>
  <rect x="36" y="30" width="1128" height="1640" rx="16" fill="#ffffff" stroke="#111111" stroke-width="2"/>

  <text x="600" y="82" text-anchor="middle" class="title">OKS MCP SERVER</text>
  <text x="600" y="111" text-anchor="middle" class="subtitle">Natural-language question to filtered TDAQ/OKS result</text>

  <rect x="225" y="150" width="750" height="92" rx="10" class="box"/>
  <text x="600" y="188" text-anchor="middle" class="label">USER</text>
  <text x="600" y="216" text-anchor="middle" class="body">Natural-language OKS question</text>

  <path d="M600 242v38" class="line"/>

  <rect x="225" y="280" width="750" height="92" rx="10" class="box"/>
  <text x="600" y="318" text-anchor="middle" class="label">CODING AGENT / MCP CLIENT</text>
  <text x="600" y="346" text-anchor="middle" class="body">Claude Code, Codex, or another MCP-compatible agent</text>

  <path d="M600 372v38" class="line"/>

  <rect x="225" y="410" width="750" height="92" rx="10" class="box"/>
  <text x="600" y="448" text-anchor="middle" class="label">LOCAL MCP ENDPOINT</text>
  <text x="600" y="476" text-anchor="middle" class="mono">http://127.0.0.1:18001/mcp</text>

  <path d="M600 502v38" class="line"/>

  <rect x="225" y="540" width="750" height="104" rx="10" class="box"/>
  <text x="600" y="578" text-anchor="middle" class="label">PRIVATE SSH LOCAL PORT FORWARD</text>
  <text x="600" y="607" text-anchor="middle" class="mono">ssh -N -L 18001:127.0.0.1:8001 &lt;cern-user&gt;@lxplus.cern.ch</text>
  <text x="600" y="630" text-anchor="middle" class="body">Encrypted access; no public port is required</text>

  <path d="M600 644v43" class="line"/>

  <rect x="105" y="687" width="990" height="780" rx="14" class="section-box"/>
  <text x="145" y="727" class="section">CERN LXPLUS</text>
  <text x="1055" y="727" text-anchor="end" class="body">TDAQ release + CVMFS runtime</text>

  <rect x="225" y="760" width="750" height="90" rx="10" class="box"/>
  <text x="600" y="798" text-anchor="middle" class="label">STREAMABLE HTTP MCP SERVER</text>
  <text x="600" y="826" text-anchor="middle" class="mono">127.0.0.1:8001 · oks_query · oks_translate · environment_probe</text>

  <path d="M600 850v38" class="line"/>

  <rect x="225" y="888" width="750" height="90" rx="10" class="box"/>
  <text x="600" y="926" text-anchor="middle" class="label">OKSQUERYSERVICE</text>
  <text x="600" y="954" text-anchor="middle" class="body">Input validation, request limits, serialization, structured response</text>

  <path d="M600 978v38" class="line"/>

  <rect x="225" y="1016" width="750" height="90" rx="10" class="box"/>
  <text x="600" y="1054" text-anchor="middle" class="label">OKS PIPELINE</text>
  <text x="600" y="1082" text-anchor="middle" class="body">Schema retrieval and few-shot context for the requested class</text>

  <path d="M600 1106v38" class="line"/>

  <rect x="225" y="1144" width="750" height="90" rx="10" class="box"/>
  <text x="600" y="1182" text-anchor="middle" class="label">LLM TRANSLATION + VALIDATION</text>
  <text x="600" y="1210" text-anchor="middle" class="body">Generate OksQuery, validate syntax, repair invalid output when needed</text>

  <path d="M600 1234v38" class="line"/>

  <rect x="225" y="1272" width="750" height="90" rx="10" class="box"/>
  <text x="600" y="1310" text-anchor="middle" class="label">OKS EXECUTOR</text>
  <text x="600" y="1338" text-anchor="middle" class="body">Python config or native oks_dump against an approved data file</text>

  <rect x="50" y="1144" width="135" height="160" rx="10" class="box"/>
  <text x="117" y="1180" text-anchor="middle" class="label">LLM API</text>
  <text x="117" y="1210" text-anchor="middle" class="body">OpenAI-</text>
  <text x="117" y="1230" text-anchor="middle" class="body">compatible</text>
  <text x="117" y="1268" text-anchor="middle" class="mono">HTTPS</text>
  <path d="M225 1189h-38" class="dashed"/>

  <rect x="1015" y="1272" width="135" height="160" rx="10" class="box"/>
  <text x="1082" y="1308" text-anchor="middle" class="label">OKS DATA</text>
  <text x="1082" y="1338" text-anchor="middle" class="body">CVMFS</text>
  <text x="1082" y="1358" text-anchor="middle" class="body">schema +</text>
  <text x="1082" y="1378" text-anchor="middle" class="body">data files</text>
  <path d="M975 1317h38" class="dashed"/>

  <path d="M600 1362v46" class="line"/>

  <rect x="225" y="1408" width="750" height="90" rx="10" class="box"/>
  <text x="600" y="1446" text-anchor="middle" class="label">FILTERED STRUCTURED RESULTS</text>
  <text x="600" y="1474" text-anchor="middle" class="body">Generated query, result count, matching IDs, attributes, version, warnings</text>

  <path d="M600 1498v43" class="line"/>

  <rect x="225" y="1541" width="750" height="76" rx="10" class="box"/>
  <text x="600" y="1572" text-anchor="middle" class="label">RETURN TO AGENT</text>
  <text x="600" y="1597" text-anchor="middle" class="body">The agent explains the result and keeps conversation memory</text>
</svg>
